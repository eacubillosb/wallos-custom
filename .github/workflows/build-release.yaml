name: Build & Release
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main
      - Main
permissions:
  contents: write
  pull-requests: write
  packages: write
env:
  # login to docker hub with provided secrets
  REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ vars.DOCKERHUB_TAG }}
  # Images are pushed only when the repository has a Docker Hub target
  # (the DOCKERHUB_TAG variable plus the DOCKERHUB_* secrets). Without it, every
  # push still runs the tests and builds the image, and publishes nothing.
  PUBLISH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_TAG != '' }}
  HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK != '' }}
  # For release-please, see available types at https://github.com/google-github-actions/release-please-action/tree/v4/?tab=readme-ov-file#release-types-supported
  PROJECT_TYPE: simple

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suite runs inside the app's own image, so it has the same PHP
      # extensions (intl, gd, sqlite) as production.
      - name: Build the app image
        run: docker build -t diamon-ci .
      - name: PHP tests
        run: docker run --rm --entrypoint php -v "$PWD":/var/www/html -w /var/www/html diamon-ci tests/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript tests
        run: |
          for file in tests/*.test.js; do
            node --test "$file"
          done

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_patterns: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - id: rp
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: ${{ env.PROJECT_TYPE }}
      - name: Prepare tags for Docker meta
        id: tags
        env:
          # When release please is skipped, these values will be empty
          is_release: ${{ steps.rp.outputs.release_created }}
          version: v${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}.${{ steps.rp.outputs.patch }}
        run: |
          tags=""
          if [[ "$is_release" = 'true' ]]; then
            tags="type=semver,pattern={{version}},value=$version
            type=ref,event=branch,value=main"
          else
            tags="type=ref,event=branch
            type=ref,event=pr"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.release.outputs.tag_patterns }}
      # necessary for multi-platform images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # necessary for multi-platform images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # always resolve php:8.3-fpm-alpine fresh, so a rebuild picks up base image security fixes
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a Docker Hub target (and on PRs) the image is built but not
          # pushed, so image refs are never built from an empty DOCKERHUB_TAG.
          outputs: ${{ env.PUBLISH != 'true' && 'type=cacheonly' || format('type=image,"name={0}/{1}",push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) }}
          # Scope cache per platform to prevent architecture-mismatched layers
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || matrix.platform == 'linux/arm64' && 'arm64' || 'armv7' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [release, build]
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_TAG != ''
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.release.outputs.tag_patterns }}
      - name: Create manifest list and push to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("${{ env.REGISTRY }}")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Send notification to Discord
        if: needs.release.outputs.release_created == 'true' && env.HAS_DISCORD == 'true'
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # v0.4.0 (pin @master to a full commit SHA)
        with:
          args: "A new release has been created: ${{ steps.meta.outputs.version }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
